<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Choose Your Adventure - The Dungeon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container">
    <h1 class="title">🏰 The Forgotten Dungeon</h1>

    <p class="description">
      You wake up on a cold stone floor with no memory of how you got here.
      Torches flicker on the walls. Somewhere in the dark, something is
      breathing. Every choice you make could lead to freedom... or doom.
      Do you have what it takes to escape?
    </p>

    <button id="startBtn" class="start-btn">Start Adventure</button>

    <!-- This section will show the final results after the game ends -->
    <section id="results" class="results hidden"></section>
  </main>

  <script src="game.js"></script>
</body>
</html>
