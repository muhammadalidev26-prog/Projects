<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Challenge</title>

  <style>
    .card {
      width: 300px;
      padding: 20px;
      /*border: 2px solid black;*/
      border-radius: 12px;
      background-color: #f0f0f0;
      box-shadow: 0px 5px 10px rgb(0 0 0 / 0.3);

    }

    .avatar {
      height: 60px;
      width: 60px;
      border-radius: 50%;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      flex: 1;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="avatar.jpg" class="avatar">
    <div class="info">
      <h3>Jane Doe</h3>
      <p>Frontend Developer</p>
    </div>
  </div>
  <hr>
  <div class="actions">
    <button>Follow</button>
    <button>Message</button>
    <button>Share</button>
  </div>
</div>
</body>
</html>
